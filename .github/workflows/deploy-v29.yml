name: Deploy Devenir un Habituel v2.9
on:
  push:
    branches: [main]
    paths:
      - 'deployment/v29/**'
      - '.github/workflows/deploy-v29.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rebuild the verified standalone HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          root = Path('deployment/v29')
          parts = sorted(root.glob('p*.txt'))
          if len(parts) != 15:
              raise SystemExit(f'Expected 15 archive parts, found {len(parts)}')
          for i, part in enumerate(parts):
              if part.name != f'p{i:02d}.txt':
                  raise SystemExit('Part number mismatch')
          encoded = ''.join(''.join(part.read_text('ascii').split()) for part in parts)
          data = base64.b64decode(encoded, validate=True)
          expected = '3289ad0d68a4bf1968a9b63aaba643718efd7e01a044bdf1c1919b49a26c3c1e'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'Checksum mismatch: {actual}')
          if b'Chroniques de Fun Radio' not in data or b'v2.9' not in data:
              raise SystemExit('Wrong game version')
          Path('index.html').write_bytes(data)
          print('Rebuilt index.html:', len(data), 'bytes', 'SHA256', actual)
          PY
      - name: Commit validated standalone page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html already up to date."
          else
            git commit -m "Deploy standalone Devenir un Habituel v2.9 (RPG arc 1)"
            git push origin HEAD:main
          fi
