<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Devenir un Habituel — v2.9</title><style>html,body{margin:0}body{font:18px system-ui;background:#181312;color:#f4dbb6;min-height:90vh;display:grid;place-items:center;text-align:center;padding:1rem;box-sizing:border-box}p{max-width:38rem}</style></head><body><main id="status" role="status"><h1>DEVENIR UN HABITUEL</h1><p>Chargement des archives de Fun Radio…</p></main><script>
(async()=>{
 const paths=Array.from({length:15},(_,i)=>"_v29/p"+String(i).padStart(2,"0")+".txt");
 const chunks=await Promise.all(paths.map(async u=>{const r=await fetch(u);if(!r.ok)throw Error("archive manquante : "+u);return (await r.text()).replace(/\s+/g,"")}));
 const encoded=chunks.join("");
 if(encoded.length!==11996416)throw Error("archive incomplète");
 const binary=atob(encoded);
 if(binary.length!==8997311)throw Error("archive incorrecte");
 const bytes=new Uint8Array(binary.length);
 for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
 const page=new TextDecoder("utf-8").decode(bytes);
 if(!page.includes("Chroniques de Fun Radio · v2.9"))throw Error("version inattendue");
 document.open();document.write(page);document.close();
})().catch(e=>{console.error(e);document.getElementById("status").innerHTML="<h1>Erreur de chargement</h1><p>Impossible de charger les archives du jeu. Réessaye en actualisant cette page.</p>";});
</script></body></html>
