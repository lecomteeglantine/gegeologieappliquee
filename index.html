<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Devenir un Habituel — v2.9</title><style>html,body{margin:0}body{font:18px system-ui;background:#181312;color:#f4dbb6;min-height:90vh;display:grid;place-items:center;text-align:center;padding:1rem;box-sizing:border-box}p{max-width:38rem}</style></head><body><main id="status" role="status"><h1>DEVENIR UN HABITUEL</h1><p>Chargement des archives de Fun Radio…</p></main><script>
(async()=>{
 const paths=Array.from({length:15},(_,i)=>"_v29/p"+String(i).padStart(2,"0")+".txt");
 const chunks=await Promise.all(paths.map(async u=>{const r=await fetch(u);if(!r.ok)throw Error("archive manquante : "+u);return (await r.text()).replace(/\s+/g,"")}));
 const encoded=chunks.join("");
 if(encoded.length!==11996416)throw Error("archive incomplète");
 const binary=atob(encoded);
 if(binary.length!==8997311)throw Error("archive incorrecte");
 const bytes=new Uint8Array(binary.length);
 for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
 const page=new TextDecoder("utf-8").decode(bytes);
 if(!page.includes("Chroniques de Fun Radio · v2.9"))throw Error("version inattendue");
 const priorRoster="<div class=\"archive-ticket\"><strong>FUN RADIO · ÉQUIPE À CETTE ÉPOQUE</strong><div>MAX <small>le studio, à l'origine du rendez-vous</small></div><div>FLORENT <small>la console de réalisation pour les Débats</small></div><div>JULIE <small>les appels entrants au standard</small></div></div>";
const updatedRoster="<div class=\"archive-ticket team-archive-v29\"><strong>FUN RADIO · ÉQUIPE À CETTE ÉPOQUE</strong><div class=\"team-photo-grid-v29\"><figure><img src=\"https://s1.dmcdn.net/v/UVRtU1eo-4Tqiq3jN/x720\" alt=\"Archive vidéo de Max au micro à l'époque du Star System\" loading=\"eager\" onerror=\"this.style.visibility='hidden'\" /><figcaption><b>MAX</b><small>Le studio, à l'origine du rendez-vous</small></figcaption></figure><figure><img src=\"archives-v29/florent.jpg\" alt=\"Photographie d'archive de Florent\" loading=\"eager\"/><figcaption><b>FLORENT</b><small>La console de réalisation pour les Débats</small></figcaption></figure><figure><img src=\"archives-v29/julie.jpg\" alt=\"Photographie d'archive de Julie\" loading=\"eager\"/><figcaption><b>JULIE</b><small>Les appels entrants au standard</small></figcaption></figure></div><p class=\"team-credit-v29\">Photographies d'archives : collection Jeu Gégé (Drive) pour Florent et Julie ; archive vidéo du Star System pour Max.</p></div>";
const photoCSS="<style>.archive-ticket.team-archive-v29{margin:22px 0}.team-archive-v29 .team-photo-grid-v29{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-top:16px;align-items:stretch}.team-archive-v29 figure{margin:0;min-width:0;overflow:hidden;background:#151515;border:1px solid #65503a;border-radius:11px}.team-archive-v29 figure img{display:block;width:100%;height:155px;object-fit:cover;object-position:center 38%;background:linear-gradient(145deg,#29231d,#0f1014)}.team-archive-v29 figure:first-child img{object-position:8% center}.team-archive-v29 figcaption{display:flex;flex-direction:column;gap:3px;padding:12px}.team-archive-v29 figcaption b{font-size:17px;color:#f2dbb8}.team-archive-v29 figcaption small{line-height:1.45;font-size:12px;color:#bec1c7}.team-archive-v29 .team-credit-v29{font:normal 11px/1.5 system-ui,sans-serif;color:#c5b59c;margin:13px 0 0}@media(max-width:650px){.team-archive-v29 .team-photo-grid-v29{grid-template-columns:1fr;gap:10px}.team-archive-v29 figure{display:grid;grid-template-columns:106px 1fr}.team-archive-v29 figure img{height:122px}.team-archive-v29 figcaption{justify-content:center}.team-archive-v29 figcaption b{font-size:16px}}</style>";
if(!page.includes(priorRoster))console.warn("First screen roster not found; leaving game text intact");
const illustrated=page.replace(priorRoster,updatedRoster).replace("</head>",photoCSS+"</head>");
document.open();document.write(illustrated);document.close();
})().catch(e=>{console.error(e);document.getElementById("status").innerHTML="<h1>Erreur de chargement</h1><p>Impossible de charger les archives du jeu. Réessaye en actualisant cette page.</p>";});
</script></body></html>
